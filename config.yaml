# Configuration for Agent IA Autonome - Multilingual Dubbing Platform

app:
  name: "Agent IA Autonome Dubbing"
  version: "1.1.0"
  description: "Autonomous AI agent for high-quality multilingual video dubbing"
  environment: "${DEPLOYMENT_ENV:development}"

server:
  host: "${API_HOST:0.0.0.0}"
  port: "${API_PORT:8000}"
  workers: "${API_WORKERS:4}"
  reload: true
  debug: "${DEBUG:false}"

logging:
  level: "${LOG_LEVEL:INFO}"
  format: "standard"
  file: "logs/agent.log"

ai:
  providers:
    stt:
      provider: "openai-whisper" # or google-stt, amazon-transcribe
      model: "large-v3"
      language_detection: true
    mt:
      provider: "deepl" # or google-translate, microsoft-translator
      api_key: "${DEEPL_API_KEY:}"
      formality: "prefer_formal"
    tts:
      provider: "google-tts" # or amazon-polly, azure-tts, elevenlabs
      ssml_enabled: true
      sampling_rate: 24000
    lipsync:
      model: "wav2lip-hq"
      gpu_enabled: true

database:
  url: "${DATABASE_URL:sqlite:///./agent.db}"
  echo: false
  pool_size: 10
  max_overflow: 20

cache:
  redis_url: "${REDIS_URL:redis://localhost:6379/0}"
  ttl: 3600

tasks:
  max_concurrent: 10
  timeout: 3600 # 1 hour for long video processing
  retry_attempts: 3
  retry_delay: 10
  chunk_size_mb: 5 # Default chunk size for uploads

security:
  require_api_key: "${REQUIRE_API_KEY:false}"
  api_key: "${API_KEY:default_secret_key}"
  cors_origins: "${CORS_ORIGINS:*}"
  request_timeout: 60
  tls_min_version: "TLSv1.2"
  gdpr_compliance:
    enabled: true
    data_retention_days: 30
    consent_required: true

monitoring:
  enabled: true
  prometheus_port: 9090
  health_check_interval: 30
  metrics:
    - wer # Word Error Rate
    - mos # Mean Opinion Score
    - latency
