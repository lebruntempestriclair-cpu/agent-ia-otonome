# Configuration for Multilingual Voice Dubbing Platform

app:
  name: "Multilingual Voice Dubbing Platform"
  version: "1.0.0"
  description: "Automated video translation and voice dubbing platform"
  environment: "${DEPLOYMENT_ENV:development}"

server:
  host: "${API_HOST:0.0.0.0}"
  port: "${API_PORT:8000}"
  workers: "${API_WORKERS:1}"
  reload: true
  debug: "${DEBUG:false}"

logging:
  level: "${LOG_LEVEL:INFO}"
  format: "json"
  file: "logs/dubbing.log"

ai:
  stt:
    provider: "whisper" # whisper, google, azure
    model: "base"
  mt:
    provider: "deepl" # deepl, google, azure
    api_key: "${DEEPL_API_KEY:}"
  tts:
    provider: "azure" # azure, google, amazon
    voice_name: "en-US-JennyNeural"
  lipsync:
    model: "wav2lip"

database:
  url: "${DATABASE_URL:sqlite:///./dubbing.db}"
  echo: false

cache:
  redis_url: "${REDIS_URL:redis://localhost:6379/0}"
  ttl: 3600

upload:
  max_size_mb: 1000
  chunk_size_mb: 5
  temp_dir: "uploads/temp"
  final_dir: "uploads/final"

security:
  require_api_key: "${REQUIRE_API_KEY:false}"
  cors_origins:
    - "*"
  request_timeout: 60
  jwt_secret: "${JWT_SECRET:changeme}"

monitoring:
  enabled: true
  prometheus_port: 9090
