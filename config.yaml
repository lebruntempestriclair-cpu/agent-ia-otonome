# Configuration for Multilingual Video Dubbing Platform

app:
  name: "Multilingual Video Dubbing Platform"
  version: "1.0.0"
  description: "Autonomous AI system for high-quality video dubbing and lip-sync"
  environment: "${DEPLOYMENT_ENV:development}"

server:
  host: "${API_HOST:0.0.0.0}"
  port: "${API_PORT:8000}"
  workers: "${API_WORKERS:4}"
  reload: true
  debug: "${DEBUG:false}"

logging:
  level: "${LOG_LEVEL:INFO}"
  format: "json"
  file: "logs/agent.log"

ai:
  providers:
    stt:
      openai_whisper:
        model: "large-v3"
        language: "auto"
      google_cloud_stt:
        api_key: "${GOOGLE_STT_API_KEY:}"
        model: "latest_long"
    mt:
      deepl:
        api_key: "${DEEPL_API_KEY:}"
        formality: "prefer_formal"
      google_translate:
        api_key: "${GOOGLE_MT_API_KEY:}"
    tts:
      amazon_polly:
        api_key: "${AWS_SECRET_KEY:}"
        engine: "neural"
      azure_tts:
        api_key: "${AZURE_TTS_KEY:}"
        region: "eastus"
    lip_sync:
      wav2lip:
        model_path: "checkpoints/wav2lip_gan.pth"
        fps: 25

database:
  url: "${DATABASE_URL:sqlite:///./agent.db}"
  echo: false
  pool_size: 10
  max_overflow: 20

cache:
  redis_url: "${REDIS_URL:redis://localhost:6379/0}"
  ttl: 3600

tasks:
  max_concurrent: 10
  timeout: 600
  retry_attempts: 3
  retry_delay: 10
  chunk_size_mb: 5

security:
  require_api_key: false
  cors_origins:
    - "*"
  request_timeout: 60

monitoring:
  enabled: true
  prometheus_port: 9090
  health_check_interval: 30
