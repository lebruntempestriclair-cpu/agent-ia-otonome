# Configuration for Plateforme de Doublage Vocal Multilingue

app:
  name: "Plateforme de Doublage"
  version: "1.0.0"
  description: "Solution de doublage automatisé haute performance"
  environment: "${DEPLOYMENT_ENV:development}"

server:
  host: "${API_HOST:0.0.0.0}"
  port: "${API_PORT:8000}"
  workers: "${API_WORKERS:4}"
  reload: true
  debug: "${DEBUG:false}"

logging:
  level: "${LOG_LEVEL:INFO}"
  format: "json"
  file: "logs/agent.log"

ai:
  stt:
    provider: "openai-whisper"
    model: "large-v3"
  mt:
    provider: "deepl"
    api_key: "${DEEPL_API_KEY:}"
  tts:
    provider: "google-cloud"
    api_key: "${GOOGLE_TTS_API_KEY:}"
  lip_sync:
    model: "wav2lip"
    use_gpu: true

storage:
  type: "s3"
  bucket: "${S3_BUCKET_NAME:dubbing-media}"
  region: "${AWS_REGION:eu-west-3}"

database:
  url: "${DATABASE_URL:sqlite:///./agent.db}"
  echo: false

cache:
  redis_url: "${REDIS_URL:redis://localhost:6379/0}"
  ttl: 3600

tasks:
  max_concurrent: 5
  timeout: 1800  # 30 minutes for large videos
  retry_attempts: 2

security:
  require_api_key: false
  cors_origins:
    - "*"
  request_timeout: 60

monitoring:
  enabled: true
  prometheus_port: 9090
