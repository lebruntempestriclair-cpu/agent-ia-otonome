# Configuration for Multilingual Dubbing Platform

app:
  name: "Multilingual Dubbing Platform"
  version: "1.0.0"
  description: "Web platform for multilingual voice dubbing and lip-sync"
  environment: "${DEPLOYMENT_ENV:development}"

server:
  host: "${API_HOST:0.0.0.0}"
  port: "${API_PORT:8000}"
  workers: "${API_WORKERS:1}"
  reload: true
  debug: "${DEBUG:false}"

logging:
  level: "${LOG_LEVEL:INFO}"
  format: "json"
  file: "logs/agent.log"

ai:
  stt:
    provider: "openai" # whisper, google, amazon
    openai:
      api_key: "${OPENAI_API_KEY:}"
      model: "whisper-1"
  mt:
    provider: "deepl" # google, microsoft
    deepl:
      api_key: "${DEEPL_API_KEY:}"
  tts:
    provider: "azure" # polly, google
    azure:
      api_key: "${AZURE_TTS_KEY:}"
      region: "${AZURE_REGION:eastus}"
    polly:
      access_key: "${AWS_ACCESS_KEY:}"
      secret_key: "${AWS_SECRET_KEY:}"
      region: "${AWS_REGION:us-east-1}"
  lip_sync:
    model: "wav2lip"

database:
  url: "${DATABASE_URL:sqlite:///./agent.db}"
  echo: false

storage:
  type: "local" # local, s3, azure_blob
  local_path: "./data/uploads"
  s3:
    bucket: "${S3_BUCKET:}"
  chunk_size_mb: 5
  max_file_size_mb: 1000

security:
  require_api_key: false
  cors_origins:
    - "*"
  request_timeout: 60

monitoring:
  enabled: true
  prometheus_port: 9090
