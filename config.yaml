# Configuration for Agent IA Autonome

app:
  name: "Agent IA Autonome"
  version: "1.0.0"
  description: "Autonomous AI agent capable of executing tasks"
  environment: "${DEPLOYMENT_ENV:development}"

server:
  host: "${API_HOST:0.0.0.0}"
  port: "${API_PORT:8000}"
  workers: "${API_WORKERS:4}"
  reload: true
  debug: "${DEBUG:false}"

logging:
  level: "${LOG_LEVEL:INFO}"
  format: "json"
  file: "logs/agent.log"

ai:
  providers:
    openai:
      api_key: "${OPENAI_API_KEY:}"
      model: "gpt-4"
      temperature: 0.7
      max_tokens: 2000
    anthropic:
      api_key: "${ANTHROPIC_API_KEY:}"
      model: "claude-3"
      temperature: 0.7

database:
  url: "${DATABASE_URL:sqlite:///./agent.db}"
  echo: false
  pool_size: 10
  max_overflow: 20

cache:
  redis_url: "${REDIS_URL:redis://localhost:6379/0}"
  ttl: 3600

tasks:
  max_concurrent: 10
  timeout: 300
  retry_attempts: 3
  retry_delay: 5

security:
  require_api_key: false
  cors_origins:
    - "*"
  request_timeout: 30

monitoring:
  enabled: true
  prometheus_port: 9090
  health_check_interval: 30
